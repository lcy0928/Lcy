name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily refresh of the price data (Consumer Council, Netherlands, Austria, ONS, Morrisons) at 10:23 Hong Kong time.
  # GitHub pauses schedules after 60 days without repository activity; re-enable under Actions if so.
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the ONS price data still parses (informational)
        continue-on-error: true
        run: node scripts/ons-build.mjs "$RUNNER_TEMP/ons.json"
      - name: Check Morrisons prices can still be read (informational, 3 items)
        continue-on-error: true
        run: node scripts/morrisons-build.mjs "$RUNNER_TEMP/morrisons.json" --check

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          touch _site/.nojekyll
      - name: Fetch Consumer Council prices
        # A failed download must not block the deploy; the app hides the panel without data.
        continue-on-error: true
        run: node scripts/opw-build.mjs _site/data/opw.json
      - name: Fetch Dutch supermarket prices (checkjebon.nl)
        # Trees only: the build reads a few older snapshots to see which stores stopped updating.
        continue-on-error: true
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/supermarkt/checkjebon.git "$RUNNER_TEMP/checkjebon"
          mkdir -p _site/data
          node --max-old-space-size=4096 scripts/market-build.mjs nl _site/data/nl.json "$RUNNER_TEMP/checkjebon"
      - name: Fetch Austrian supermarket prices (Heisse Preise)
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/hp.tar.gz" https://github.com/falknerdominik/heisse-preise-data/releases/latest/download/latest-canonical.tar.gz
          tar -xzf "$RUNNER_TEMP/hp.tar.gz" -C "$RUNNER_TEMP" latest-canonical.json
          mkdir -p _site/data
          node --max-old-space-size=4096 scripts/market-build.mjs at _site/data/at.json "$RUNNER_TEMP/latest-canonical.json"
      - name: Fetch UK typical prices (ONS price quotes, monthly)
        continue-on-error: true
        run: node scripts/ons-build.mjs _site/data/ons.json
      - name: Fetch Morrisons prices (50 everyday items, daily)
        continue-on-error: true
        run: node scripts/morrisons-build.mjs _site/data/morrisons.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
